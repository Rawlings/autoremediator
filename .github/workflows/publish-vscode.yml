name: Publish VS Code extension

on:
  push:
    branches:
      - master
    paths:
      - packages/vscode-extension/**
      - .github/workflows/publish-vscode.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      # The extension uses pnpm `catalog:` specifiers, which npm cannot resolve.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter autoremediator-rawlings build

      - name: Publish to VS Code Marketplace
        working-directory: packages/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # The locked vsce from the workspace, not an `npx` download with its own unlocked tree
        # next to the marketplace token.
        run: pnpm exec vsce publish --no-dependencies --pat "$VSCE_PAT"
