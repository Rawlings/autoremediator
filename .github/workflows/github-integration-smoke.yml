name: GitHub Integration Smoke

on:
  push:
    branches:
      - main
      - master
    paths:
      - action.yml
      - .github/workflows/reusable-remediate-from-audit.yml
      - .github/workflow-templates/**
      - .github/workflows/github-integration-smoke.yml
      - .github/fixtures/**
  pull_request:
    paths:
      - action.yml
      - .github/workflows/reusable-remediate-from-audit.yml
      - .github/workflow-templates/**
      - .github/workflows/github-integration-smoke.yml
      - .github/fixtures/**
  workflow_dispatch:

concurrency:
  group: github-integration-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable-workflow-smoke:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-remediate-from-audit.yml
    with:
      scan-file: .github/fixtures/npm-audit-empty.json
      audit: false
      dry-run: true
      ci: true
      # The version on npm is whatever was last released; test the code in this change.
      build-from-source: true

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Build and pack autoremediator from this change
        id: pack
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/core build
          mkdir -p "$RUNNER_TEMP/autoremediator-pack"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/autoremediator-pack" >/dev/null)
          echo "tarball=$(ls "$RUNNER_TEMP"/autoremediator-pack/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Run composite action in scan-file mode
        uses: ./
        with:
          package: ${{ steps.pack.outputs.tarball }}
          scan-file: .github/fixtures/npm-audit-empty.json
          dry-run: "true"
          ci: "true"

      - name: Run composite action in single-CVE mode
        uses: ./
        with:
          package: ${{ steps.pack.outputs.tarball }}
          cve-id: CVE-2021-23337
          dry-run: "true"

      - name: Verify input validation for mutually-exclusive modes
        id: invalid-inputs
        continue-on-error: true
        uses: ./
        with:
          scan-file: .github/fixtures/npm-audit-empty.json
          audit: "true"

      - name: Assert invalid input failure
        if: ${{ steps.invalid-inputs.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected composite action to fail for scan-file + audit input combination."
          exit 1

      - name: Verify input validation for cve-id plus scan-file
        id: invalid-cve-scan
        continue-on-error: true
        uses: ./
        with:
          cve-id: CVE-2021-23337
          scan-file: .github/fixtures/npm-audit-empty.json

      - name: Assert cve-id plus scan-file failure
        if: ${{ steps.invalid-cve-scan.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected composite action to fail for cve-id + scan-file input combination."
          exit 1

      - name: Verify input validation for audit plus sarif format
        id: invalid-audit-sarif
        continue-on-error: true
        uses: ./
        with:
          audit: "true"
          format: sarif

      - name: Assert audit plus sarif failure
        if: ${{ steps.invalid-audit-sarif.outcome != 'failure' }}
        shell: bash
        run: |
          echo "Expected composite action to fail for audit + sarif input combination."
          exit 1
