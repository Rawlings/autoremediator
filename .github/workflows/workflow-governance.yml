name: Workflow Governance

on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/**
      - .github/workflow-templates/**
      - docs/integrations/**
      - README.md
  push:
    branches:
      - main
      - master
    paths:
      - action.yml
      - .github/workflows/**
      - .github/workflow-templates/**
      - docs/integrations/**
      - README.md
  workflow_dispatch:

concurrency:
  group: workflow-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Finds injection and over-permission patterns actionlint does not. Advisory until the existing
      # findings are triaged; then drop `continue-on-error`.
      - name: Audit workflows with zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

      - name: Lint workflows with actionlint
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0

  enforce-stable-references:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce stable reusable-workflow references
        shell: bash
        run: |
          set -euo pipefail

          if rg --line-number --no-heading "reusable-remediate-from-audit\.yml@main" \
            .github/workflow-templates \
            docs/integrations \
            README.md; then
            echo "Found unstable @main reference for reusable workflow; pin a release tag or a commit SHA instead."
            exit 1
          fi

  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate workflow template metadata
        shell: bash
        run: |
          set -euo pipefail

          for metadata in .github/workflow-templates/*.properties.json; do
            [ -f "$metadata" ] || continue

            workflow="${metadata%.properties.json}.yml"
            if [ ! -f "$workflow" ]; then
              echo "Missing workflow template for metadata file: $metadata"
              exit 1
            fi

            jq -e '
              .name | type == "string" and length > 0
            ' "$metadata" >/dev/null

            jq -e '
              .description | type == "string" and length > 0
            ' "$metadata" >/dev/null

            jq -e '
              .iconName | type == "string" and length > 0
            ' "$metadata" >/dev/null

            jq -e '
              .categories | type == "array" and length > 0
            ' "$metadata" >/dev/null
          done
