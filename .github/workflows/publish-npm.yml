name: Publish autoremediator to npm

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Nothing here may write; the one job that needs the OIDC token asks for it itself.
permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # Never publish code that has not passed lint, typecheck, build and tests.
  verify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Installs and builds with every dependency's code, and holds no credential that can publish.
  build:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --dir packages/core build

      # pnpm, not npm: only pnpm rewrites `catalog:` and `workspace:` ranges to real versions.
      # (autoremediator@0.21.2 shipped with `yaml: "catalog:"` because npm published it as is.)
      - name: Pack
        id: pack
        working-directory: packages/core
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball=$(ls "$RUNNER_TEMP/pack")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          if grep -q 'catalog:\|workspace:' <(tar -xOzf "$RUNNER_TEMP/pack/$tarball" package/package.json); then
            echo "The packed package.json still has catalog: or workspace: ranges" >&2
            exit 1
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Runs no install and no build: it publishes exactly the tarball the build job made.
  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack

      - name: Publish to npm
        env:
          TARBALL: ${{ runner.temp }}/pack/${{ needs.build.outputs.tarball }}
        run: |
          name=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          version=$(tar -xOzf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "$TARBALL" --provenance --access public
