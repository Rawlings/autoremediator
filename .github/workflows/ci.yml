name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: dependent packages (github-app, vscode-extension) resolve core's
      # built types, and type-aware lint needs them too.
      - name: Build all packages
        run: pnpm build:all

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck all packages
        run: pnpm typecheck:all

      - name: Test all packages
        run: pnpm test:all

      # A published manifest must not carry pnpm-only protocols: npm cannot install `catalog:`.
      - name: Check published manifests have no catalog or workspace ranges
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ] && continue
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packed" >/dev/null)
          done
          for tarball in "$RUNNER_TEMP"/packed/*.tgz; do
            if tar -xOzf "$tarball" package/package.json | grep -E '"(catalog|workspace):'; then
              echo "::error::$tarball contains an unresolved catalog:/workspace: range"
              exit 1
            fi
          done
